    <text x="165" y="355" font-family="'Comic Sans MS',cursive" font-size="23" fill="#57574d">As a member,</text>
    <text x="165" y="390" font-family="'Comic Sans MS',cursive" font-size="23" fill="#57574d">I want to sign in</text>
